[project]
name = "lexguard"
version = "0.1.7"
description = "Lexicons that score text for a concept, with evaluators for pydantic-evals, DeepEval, and Inspect AI"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
pydantic-evals = [
    "pydantic-evals>=1.0",
]
deepeval = [
    "deepeval>=4.1.8",
]
inspect-ai = [
    "inspect-ai>=0.3.259",
]

[project.scripts]
lexguard = "lexguard.cli:main"
lg = "lexguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexguard"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0.0",
    "pytest-examples>=0.0.18",
    "pytest-xdist>=3.0.0",
    "ruff>=0.3.0",
    "basedpyright>=1.10.0",
    "prek>=0.1.0",
    "vulture>=2.11",
    "bandit>=1.7.0",
    "deptry>=0.12.0",
    "bump-my-version>=0.28.0",
    "zensical>=0.0.10",
    "pydantic-ai-slim>=2.31.1",
    "pydantic-evals>=1.0",
    "deepeval>=4.1.8",
    "inspect-ai>=0.3.259",
    "hypothesis>=6.165.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# pytest-examples (tests/test_docs.py) is the source of truth for the Python examples embedded
# in Markdown docs, and expects its own `#>` output-comment convention. Keep ruff off .md files
# so its markdown-code formatting doesn't fight that convention.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"src/lexguard/__init__.py" = ["F403"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=lexguard",
    "--cov-branch",
    "--cov-report=term-missing",
    "--strict-markers",
]
markers = [
    "unit: Fast unit tests (no subprocess, can run in parallel with -n auto)",
    "integration: Slow integration tests (subprocess, run sequentially)",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.basedpyright]
include = ["src/lexguard"]
typeCheckingMode = "standard"

[tool.deptry]
extend_exclude = ["tests", "examples"]

[tool.deptry.per_rule_ignores]
DEP002 = ["pytest", "pytest-cov", "pytest-examples", "pytest-xdist", "ruff", "basedpyright", "prek", "vulture", "bandit", "deptry", "bump-my-version", "zensical", "pydantic-ai-slim", "hypothesis"]
DEP003 = ["lexguard", "pydantic"]

[tool.bumpversion]
current_version = "0.1.7"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "src/lexguard/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""
