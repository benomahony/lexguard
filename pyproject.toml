[project]
name = "lexica"
version = "0.1.0"
description = "Word lists that assert, for pydantic-evals"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim>=2.31.1",
    "pydantic-evals>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexica"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-examples>=0.0.18",
]
